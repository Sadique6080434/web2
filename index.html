<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flower World</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fff5f7;
        }
        header {
            background-color: #ff99cc;
            color: white;
            text-align: center;
            padding: 20px;
        }
        nav {
            background-color: #ff66a3;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        section {
            padding: 20px;
        }
        .flower-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin: 10px;
            display: inline-block;
            width: 250px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .flower-card img {
            width: 100%;
            border-radius: 10px;
        }
        footer {
            background-color: #ff99cc;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>🌸 Flower World 🌸</h1>
    <p>Welcome to the beauty of nature</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Flowers</a>
    <a href="#">Gallery</a>
    <a href="#">Contact</a>
</nav>

<section>
    <h2>Popular Flowers</h2>

    <div class="flower-card">
        <img src="https://via.placeholder.com/250x150?text=Rose" alt="Rose">
        <h3>Rose</h3>
        <p>Symbol of love and passion.</p>
    </div>

    <div class="flower-card">
        <img src="https://via.placeholder.com/250x150?text=Lotus" alt="Lotus">
        <h3>Lotus</h3>
        <p>Represents purity and enlightenment.</p>
    </div>

    <div class="flower-card">
        <img src="https://via.placeholder.com/250x150?text=Sunflower" alt="Sunflower">
        <h3>Sunflower</h3>
        <p>Bright and full of happiness.</p>
    </div>

</section>

<footer>
    <p>© 2026 Flower World | Made with 🌸</p>
</footer>

</body>
</html>
